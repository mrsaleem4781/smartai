    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .print-sheet {
            background: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            margin: auto;
            position: relative;
            transform-origin: top center;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #root, #root * {
                visibility: visible;
            }
            .no-print {
                display: none !important;
            }
            .print-sheet {
                position: absolute;
                left: 0;
                top: 0;
                box-shadow: none;
                margin: 0;
                visibility: visible !important;
            }
            .print-sheet * {
                visibility: visible !important;
            }
        }
    </style>
